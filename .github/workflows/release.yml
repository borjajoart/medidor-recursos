name: Release

# Al subir una etiqueta vX.Y.Z se compila y se publica el zip en Releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --release
      - name: Compilar
        run: cargo build --release
      - name: Empaquetar
        shell: pwsh
        run: |
          $dir = "medidor-recursos"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/release/medidor-gui.exe, target/release/medidor-recursos.exe, LICENSE $dir
          Copy-Item distribuir/MANUAL.md, distribuir/captura-gui.png $dir
          Copy-Item ejemplo/informe_ejemplo.html $dir
          Compress-Archive -Path "$dir/*" -DestinationPath "medidor-recursos-windows.zip"
      - name: Publicar
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = "medidor-recursos-windows.zip"
          gh release view "${{ github.ref_name }}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "${{ github.ref_name }}" $zip --clobber
          } else {
            gh release create "${{ github.ref_name }}" $zip --title "${{ github.ref_name }}" --generate-notes
          }
