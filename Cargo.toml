[package]
name = "medidor-recursos"
version = "0.1.0"
edition = "2024"
description = "Monitor ligero de procesos y temperaturas para diagnosticar bajadas de FPS"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
nvml-wrapper = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }
wmi = "0.18.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
