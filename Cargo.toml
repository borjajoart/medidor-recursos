[package]
name = "medidor-recursos"
version = "0.3.0"
edition = "2024"
description = "Monitor ligero de procesos y temperaturas para diagnosticar bajadas de FPS"
license = "MIT"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
ferrisetw = "1.2.0"
native-windows-gui = { version = "1.0.13", default-features = false, features = ["high-dpi", "combobox", "animation-timer", "frame", "tray-notification", "menu", "message-window", "embed-resource", "file-dialog"] }
nvml-wrapper = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.40.4", default-features = false, features = ["system", "network"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Performance", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_Security", "Win32_System_Diagnostics_Debug"] }
wmi = "0.18.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
embed-resource = "3.0.12"
